apiVersion: apps/v1
kind: Deployment
metadata:
  name: carepulse-core-service
  namespace: carepulse
  labels:
    app: carepulse-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: carepulse-core
  template:
    metadata:
      labels:
        app: carepulse-core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: core-service
          image: ghcr.io/carepulse/carepulse-core-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MONGO_URI
              value: "mongodb://carepulse-mongodb.carepulse.svc.cluster.local:27017/carepulse_db"
            - name: AI_SERVICE_URL
              value: "http://carepulse-ai-service.carepulse.svc.cluster.local:8000"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: carepulse-core-service
  namespace: carepulse
spec:
  type: ClusterIP
  selector:
    app: carepulse-core
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: carepulse-core-hpa
  namespace: carepulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: carepulse-core-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
