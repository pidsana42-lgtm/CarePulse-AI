apiVersion: apps/v1
kind: Deployment
metadata:
  name: carepulse-ai-service
  namespace: carepulse
  labels:
    app: carepulse-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: carepulse-ai
  template:
    metadata:
      labels:
        app: carepulse-ai
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: ai-service
          image: ghcr.io/carepulse/carepulse-ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: VECTOR_DB_HOST
              value: "carepulse-vectordb.carepulse.svc.cluster.local"
            - name: VECTOR_DB_PORT
              value: "6333"
            - name: MONGO_URI
              value: "mongodb://carepulse-mongodb.carepulse.svc.cluster.local:27017/carepulse_db"
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2048Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: carepulse-ai-service
  namespace: carepulse
spec:
  type: ClusterIP
  selector:
    app: carepulse-ai
  ports:
    - port: 8000
      targetPort: 8000
      name: http
