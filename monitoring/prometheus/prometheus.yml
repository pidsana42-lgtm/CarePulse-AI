global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # 1. Scrape FastAPI AI Inference Engine
  - job_name: 'fastapi-ai-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend-ai:8000']

  # 2. Scrape Spring Boot Core & Eligibility Service
  - job_name: 'spring-boot-core-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend-core:8080']

  # 3. Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
