name: CarePulse CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/carepulse

jobs:
  # ----------------------------------------------------
  # 1. Test & Build Spring Boot Core Backend
  # ----------------------------------------------------
  test-spring-boot:
    name: Test Spring Boot Core Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test with Maven
        run: |
          cd backend-spring-boot
          mvn clean test

  # ----------------------------------------------------
  # 2. Test & Lint FastAPI AI Service
  # ----------------------------------------------------
  test-fastapi-ai:
    name: Test FastAPI AI Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Lint Code
        run: |
          python -m py_compile backend/app/main.py

  # ----------------------------------------------------
  # 3. Test & Build Next.js Frontend
  # ----------------------------------------------------
  test-frontend:
    name: Test & Build Next.js Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  # ----------------------------------------------------
  # 4. Build & Push Container Images (Microservices)
  # ----------------------------------------------------
  build-and-push-images:
    name: Build & Push Docker Images to GHCR
    needs: [test-spring-boot, test-fastapi-ai, test-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Spring Boot Core Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-spring-boot
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-core-service:latest

      - name: Build & Push FastAPI AI Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ai-service:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest

  # ----------------------------------------------------
  # 5. Kubernetes Deployment Validation (GitOps/Deploy)
  # ----------------------------------------------------
  deploy-kubernetes:
    name: Validate & Deploy to Kubernetes Cluster
    needs: build-and-push-images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Validate Kubernetes Manifests
        run: |
          kubectl apply --dry-run=client -f k8s/namespace.yaml
          kubectl apply --dry-run=client -f k8s/spring-boot-deployment.yaml
          kubectl apply --dry-run=client -f k8s/fastapi-ai-deployment.yaml
          kubectl apply --dry-run=client -f k8s/frontend-deployment.yaml
